name: Privacy Law Monitor Agent

on:
  schedule:
    # 매일 한국 시간 기준 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동으로도 실행 가능하게 설정

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v5 # 또는 최신 major 버전 유지

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
          python-version: '3.11' # 누락되었던 파이썬 버전 지정 추가
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Privacy Law Agent
      env:
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
      run: |
        python main.py
